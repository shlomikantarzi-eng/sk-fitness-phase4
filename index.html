    else n.setAttribute(k, v);
  }
  kids.flat().forEach(k => { if (k == null) return; n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); });
  return n;
}

document.title = P.title;
document.getElementById('brandName').textContent = P.brand;
document.querySelectorAll('.top-tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
function showTab(t) {
  document.querySelectorAll('.tab-view').forEach(v => v.classList.toggle('active', v.id === 'view-' + t));
  document.querySelectorAll('.top-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  document.getElementById('totalBar').classList.toggle('show', t === 'nutrition');
  window.scrollTo(0, 0);
}

/* weeks */
document.getElementById('trackerTitle').textContent = '🎯 ' + P.trackerTitle;
const wg = document.getElementById('weeksGrid');
P.weeks.forEach(w => {
  const b = el('div', { class: 'week-btn' + (state.w[w] ? ' checked' : ''), onclick: () => { state.w[w] = !state.w[w]; b.classList.toggle('checked', state.w[w]); countWeeks(); save(); } }, 'שבוע ' + w);
  wg.appendChild(b);
});
function countWeeks() { document.getElementById('weeksCount').textContent = P.weeks.filter(w => state.w[w]).length + '/' + P.weeks.length + ' שבועות'; }
countWeeks();

/* focus */
const fc = document.getElementById('focusCard');
fc.appendChild(el('span', { class: 'badge' }, P.focus.badge));
fc.appendChild(el('h2', null, P.focus.title));
fc.appendChild(el('ul', { class: 'clean muted' }, P.focus.points.map(p => el('li', { html: p }))));

/* days */
const daysWrap = document.getElementById('days');
const nav = el('div', { class: 'day-nav' });
P.days.forEach((d, di) => nav.appendChild(el('button', { class: 'nav-chip ' + (d.kind || ''), type: 'button', onclick: () => document.getElementById('day' + di).scrollIntoView({ behavior: 'smooth', block: 'start' }) }, d.nav || d.label)));
daysWrap.appendChild(nav);
P.days.forEach((d, di) => {
  const card = el('div', { class: 'card day-card ' + (d.kind || ''), id: 'day' + di });
  const prog = el('span', { class: 'day-progress' });
  const body = el('div', { class: 'day-body' + (state.open[di] === false ? ' collapsed' : '') });
  const head = el('div', { class: 'day-head', onclick: () => { body.classList.toggle('collapsed'); state.open[di] = !body.classList.contains('collapsed'); save(); } },
    el('div', null,
      el('div', { class: 'day-label ' + (d.kind || '') }, d.label),
      el('div', { class: 'day-sub' }, d.kind === 'optional' ? el('span', { class: 'opt-chip' }, 'לא חובה') : null, d.time ? el('span', { class: 'time-chip' }, '⏱️ ' + d.time) : null),
      el('h2', null, d.title)), prog);
  card.appendChild(head);
  if (d.intro) body.appendChild(el('p', { class: 'muted' }, d.intro));
  const updateProg = () => { const n = d.items.filter(i => state.t[i.id]).length; prog.textContent = n + '/' + d.items.length + ' ✓'; };
  let prevSS = null;
  d.items.forEach((it, idx) => {
    const cb = el('input', { type: 'checkbox' });
    cb.checked = !!state.t[it.id];
    const ss = it.superset || null;
    const nextSS = d.items[idx + 1] && d.items[idx + 1].superset;
    const row = el('div', { class: 'ex' + (it.cardio ? ' cardio-item' : '') + (ss ? ' in-ss' : '') + (cb.checked ? ' done' : '') });
    if (ss && ss !== prevSS) daysWrapSS(body, ss);
    prevSS = ss;
    cb.addEventListener('change', () => { state.t[it.id] = cb.checked; row.classList.toggle('done', cb.checked); updateProg(); save(); });
    const top = el('label', { class: 'ex-top' }, cb, el('div', { class: 'ex-title' },
      el('div', { class: 'ex-name' }, it.name, it.tag ? el('span', { class: 'tag' }, it.tag) : null),
      it.en ? el('div', { class: 'ex-en' }, it.en) : null,
      el('div', { class: 'ex-sets' }, it.sets)));
    row.appendChild(top);
    const info = el('div', { class: 'ex-info' });
    if (it.target) info.appendChild(el('div', null, '🎯 ', el('strong', null, 'עובד על: '), it.target));
    if (it.weight) info.appendChild(el('div', null, it.cardio ? '📌 ' : '⚖️ ', it.cardio ? '' : el('strong', null, 'משקל: '), it.weight));
    if (it.how && it.how.length) {
      info.appendChild(el('div', { class: 'how-title' }, 'איך מבצעים:'));
      info.appendChild(el('ol', { class: 'how' }, it.how.map(h => el('li', null, h))));
    }
    if (it.video) info.appendChild(el('a', { class: 'video-btn', href: 'https://www.youtube.com/watch?v=' + it.video, target: '_blank', rel: 'noopener' }, '▶ סרטון הדגמה'));
    row.appendChild(info);
    body.appendChild(row);
    if (ss && nextSS !== ss) body.appendChild(el('div', { class: 'ss-end' }, '↩︎ סוף סופר-סט ' + ss + ': עכשיו מנוחה של 60–90 שנ\', וחוזרים על הזוג.'));
  });
  card.appendChild(body);
  daysWrap.appendChild(card);
  updateProg();
});
function daysWrapSS(body, ss) {
  body.appendChild(el('div', { class: 'ss-start' }, '🔗 סופר-סט ' + ss + ': שני התרגילים הבאים ברצף, בלי מנוחה ביניהם'));
}

function resetWeek() {
  if (!confirm('לאפס את סימוני האימונים של השבוע?')) return;
  state.t = {}; save(); location.reload();
}

/* timer */
let timerInterval;
function startTimer(sec) {
  clearInterval(timerInterval);
  let t = sec; const d = document.getElementById('timerDisplay');
  d.textContent = t + ' שנ\'';
  timerInterval = setInterval(() => {
    t--;
    if (t <= 0) { clearInterval(timerInterval); d.textContent = 'צא לסט!'; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
    else d.textContent = t + ' שנ\'';
  }, 1000);
}

/* nutrition */
const N = P.nutrition;
document.getElementById('macroBar').innerHTML = '';
[[N.target.kcal, 'קק"ל (יעד)'], [N.target.p, 'חלבון'], [N.target.c, 'פחמימה'], [N.target.f, 'שומן']].forEach(([v, l]) =>
  document.getElementById('macroBar').appendChild(el('div', null, el('strong', null, v), l)));
const ni = document.getElementById('nutritionIntro');
ni.appendChild(el('span', { class: 'badge' }, N.badge));
ni.appendChild(el('h2', null, N.title));
ni.appendChild(el('p', { class: 'muted', html: N.intro }));
if (N.stages) {
  const tbl = el('table', { class: 'stage-table' }, el('tr', null, el('th', null, 'שבועות'), el('th', null, 'קק"ל'), el('th', null, 'מה עושים')));
  N.stages.forEach(s => tbl.appendChild(el('tr', null, el('td', null, s[0]), el('td', null, s[1]), el('td', { html: s[2] }))));
  ni.appendChild(tbl);
}
ni.appendChild(el('h3', null, 'כללי הזהב של השלב'));
ni.appendChild(el('div', { class: 'inner' }, el('ul', { class: 'clean' }, N.rules.map(r => el('li', { html: r })))));

const ms = document.getElementById('mealSections');
N.meals.forEach(cat => {
  ms.appendChild(el('h3', null, cat.title));
  if (cat.hint) ms.appendChild(el('p', { class: 'muted', style: 'margin:0 0 4px; font-size:0.82rem;' }, cat.hint));
  const multi = !!cat.multi;
  const sel = state.meals[cat.id] || (multi ? [] : null);
  cat.options.forEach((o, oi) => {
    const inp = el('input', { type: multi ? 'checkbox' : 'radio', name: 'm_' + cat.id });
    inp.checked = multi ? sel.includes(oi) : sel === oi;
    const box = el('label', { class: 'opt' + (inp.checked ? ' selected' : '') }, inp,
      el('div', null,
        el('div', { class: 'opt-name' }, o.name, o.tag ? el('span', { class: 'tag' }, o.tag) : null),
        el('div', { class: 'opt-desc', html: o.desc }),
        el('div', { class: 'opt-macros' }, '~' + o.kcal + ' קק"ל | ' + o.p + ' ח׳ | ' + o.c + ' פ׳ | ' + o.f + ' ש׳')));
    inp.addEventListener('change', () => {
      if (multi) {
        let arr = state.meals[cat.id] || [];
        arr = inp.checked ? [...new Set([...arr, oi])] : arr.filter(x => x !== oi);
        state.meals[cat.id] = arr;
      } else state.meals[cat.id] = oi;
      ms.querySelectorAll('input[name="m_' + cat.id + '"]').forEach(x => x.closest('.opt').classList.toggle('selected', x.checked));
      save(); totals();
    });
    ms.appendChild(box);
  });
});
function totals() {
  const t = { kcal: 0, p: 0, c: 0, f: 0 };
  N.meals.forEach(cat => {
    const s = state.meals[cat.id];
    const idx = cat.multi ? (s || []) : (s == null ? [] : [s]);
    idx.forEach(i => { const o = cat.options[i]; if (o) { t.kcal += o.kcal; t.p += o.p; t.c += o.c; t.f += o.f; } });
  });
  const R = N.range;
  const cls = (v, [lo, hi], k) => v === 0 ? '' : v < lo ? 'low' : (v > hi && k !== 'p') ? 'high' : 'ok';
  const g = document.getElementById('totalGrid'); g.innerHTML = '';
  [['kcal', 'קק"ל'], ['p', 'חלבון'], ['c', 'פחמימה'], ['f', 'שומן']].forEach(([k, l]) =>
    g.appendChild(el('div', null, el('strong', { class: cls(t[k], R[k], k) }, String(Math.round(t[k]))), l + ' (' + R[k][0] + '–' + R[k][1] + ')')));
}
totals();

/* guide */
const gc = document.getElementById('guideContent');
P.guide.forEach(sec => {
  const c = el('div', { class: 'card' });
  c.appendChild(el('span', { class: 'badge' }, sec.badge));
  c.appendChild(el('h2', null, sec.title));
  if (sec.intro) c.appendChild(el('p', { class: 'muted', html: sec.intro }));
  if (sec.points) c.appendChild(el('div', { class: 'inner' }, el('ul', { class: 'clean' }, sec.points.map(p => el('li', { html: p })))));
  gc.appendChild(c);
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
